databases:
  - name: kubico-db
    databaseName: kubico
    user: kubico
    plan: free

services:
  - type: web
    name: kubico-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: sh start.sh
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kubico-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: ALLOWED_ORIGINS
        value: "https://frontend-9l8i-ten.vercel.app,http://localhost:3000"
      - key: ADMIN_SETUP_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: LOCAL_UPLOAD_DIR
        value: /tmp/kubico_uploads
      - key: LOCAL_UPLOAD_PUBLIC_BASE
        value: /uploads
