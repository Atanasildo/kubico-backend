version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: kubico_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kubico}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kubico}
      POSTGRES_DB: ${POSTGRES_DB:-kubico}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kubico}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    container_name: kubico_api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kubico}:${POSTGRES_PASSWORD:-kubico}@db:5432/${POSTGRES_DB:-kubico}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - kubico-uploads:/tmp/kubico_uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres-data:
  kubico-uploads:
